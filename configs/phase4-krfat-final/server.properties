Switch each broker to KRaft mode.

a) Update the broker configuration in the server.properties file:

Replace the broker.id with a node.id using the same ID
Add a broker KRaft role for the broker
Remove the inter-broker protocol version (inter.broker.protocol.version)
Remove the migration enabled flag (zookeeper.metadata.migration.enable)
Remove ZooKeeper configuration including Jaas file.
Remove the listener for controller and broker communication (control.plane.listener.name)
Restart the broker one at a time, each broker is restarted with a Kraft configuration until the entire cluster is running in KRaft mode.

# ================================================================

# Phase 4 — Broker in Full KRaft Mode (FINAL)

# ZooKeeper completely removed from broker configuration

# This is the final production configuration


# ── Updated config as below ───────────────────────────────────────────

# CHANGED: broker.id → node.id (same number)
node.id=1
# ADDED: process.roles — defines this node as broker
process.roles=broker
# ── KRaft Controller Quorum ───────────────────────────────────
controller.quorum.voters=101@broker1.example.com:9093,102@broker2.example.com:9093,103@broker3.example.com:9093
# ── Listeners ─────────────────────────────────────────────────
listeners=PLAINTEXT://broker1.example.com:9092,EXTERNAL://0.0.0.0:29095,SASL_PLAINTEXT://broker1.example.com:9095
advertised.listeners=PLAINTEXT://broker1.example.com:9092,EXTERNAL://kafka.example.com:29095,SASL_PLAINTEXT://broker1.example.com:9095
controller.listener.names=CONTROLLER
listener.security.protocol.map=SASL_PLAINTEXT:SASL_PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT,CONTROLLER:SASL_PLAINTEXT
# ── Security ──────────────────────────────────────────────────
security.inter.broker.protocol=SASL_PLAINTEXT
sasl.enabled.mechanisms=PLAIN
sasl.mechanism.inter.broker.protocol=PLAIN
sasl.mechanism.controller.protocol=PLAIN
# ── Authorization ─────────────────────────────────────────────
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=true
super.users=User:admin
# ── Storage ───────────────────────────────────────────────────
log.dirs=/opt/kafka/data
num.partitions=3
default.replication.factor=3
min.insync.replicas=2
auto.create.topics.enable=false
delete.topic.enable=true
log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=1


# ── REMOVED from Phase 3 ──────────────────────────────────────
# inter.broker.protocol.version=3.9.1          ← REMOVED
# zookeeper.metadata.migration.enable=true      ← REMOVED
# zookeeper.connect=...                         ← REMOVED
# ZooKeeper JAAS config reference               ← REMOVED

NOTE - Once the migration has been finalized, you can safely deprovision your ZooKeeper cluster,
assuming you are not using it for anything else. After this point, it is no longer possible to revert to ZooKeeper mode.
