# ================================================================

# Phase 2 — KRaft Controller in Migration Mode

# Controller is starting alongside ZooKeeper

# ZooKeeper is still running at this point

# Run format-storage.sh before starting controller

a) Configure a controller node on each host using the controller.properties file.

At a minimum, each controller requires the following configuration:
A unique node ID
The migration enabled flag set to true
Zookeeper connection details
A quorum of controller voters
Listener name for inter-broker communication
#================================================================
b) Set up log directories for each controller node and Format Controller Storage

Run this on each controller node: ./kafka-storage.sh format -t (clusterID) -c /opt/kafka/config/kraft/controller.properties 

# ================================================================
Configuration as below -

# Unique node ID for this controller
node.id=101
# This node runs ONLY as controller
process.roles=controller
# All 3 controller voters
controller.quorum.voters=101@broker1.example.com:9093,102@broker2.example.com:9093,103@broker3.example.com:9093
# Controller listener
controller.listener.names=CONTROLLER
listeners=CONTROLLER://broker1.example.com:9093
# ── ZooKeeper connection (still needed in Phase 2) ──────────
zookeeper.connect=zk1.example.com:2181,zk2.example.com:2181,zk3.example.com:2181/cluster-name
zookeeper.security.protocol=SASL_PLAINTEXT
# CRITICAL — enables migration mode
zookeeper.metadata.migration.enable=true
# ── Security ─────────────────────────────────────────────────
sasl.enabled.mechanisms=PLAIN
sasl.mechanism.controller.protocol=PLAIN
listener.security.protocol.map=CONTROLLER:SASL_PLAINTEXT
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=true
super.users=User:admin
# ── Performance ──────────────────────────────────────────────
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600
# ── Storage ───────────────────────────────────────────────────
# KRaft metadata logs — separate from broker data
log.dirs=/opt/data/kraft/meta-logs
num.partitions=1
num.recovery.threads.per.data.dir=1
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=1

c) Start each controller one at a time 
check the status and check the logs of each controller to ensure that they have successfully joined the KRaft cluster

Check controller quorum status -

