# ================================================================

# Phase 1 — Preparation

# Enable TRACE logging for KRaft migration visibility

# Add these lines to existing log4j.properties on each broker

# and each KRaft controller node

# ================================================================
# Enable TRACE for migration driver

log4j.logger.org.apache.kafka.metadata.migration=TRACE

# Enable DEBUG for KRaft controller

log4j.logger.org.apache.kafka.controller=DEBUG

# Enable DEBUG for metadata

log4j.logger.org.apache.kafka.metadata=DEBUG
