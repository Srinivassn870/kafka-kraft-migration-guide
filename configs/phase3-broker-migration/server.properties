# ================================================================

# Phase 3 — Broker in Migration Mode
# Brokers reconfigured to connect to KRaft controllers
# ZooKeeper still running — DUAL WRITE phase
# Both ZooKeeper AND KRaft controller receive metadata

# ================================================================
a) Reconfigure a server. properties file.
At a minimum, each broker requires the following additional configuration:
Inter-broker protocol version set to version 3.9.1
The migration enabled flag
Controller configuration that matches the controller nodes
A quorum of controller voters
#################################################

Example  configuration: 

# ── Broker Identity ───────────────────────────────────────────

# Still using broker.id in Phase 3
broker.id=0
# Inter-broker protocol — set to current Kafka version
inter.broker.protocol.version=3.9.1
# ── KRaft Controller Connection ───────────────────────────────
controller.quorum.voters=101@broker1.example.com:9093,102@broker2.example.com:9093,103@broker3.example.com:9093
controller.listener.names=CONTROLLER
listeners=CONTROLLER://broker1.example.com:9093
listener.security.protocol.map=CONTROLLER:PLAINTEXT
# ── CRITICAL — Migration Flags ────────────────────────────────
# These lines MUST be present in Phase 3
zookeeper.metadata.migration.enable=true
zookeeper.connect=zk1.example.com:2181,zk2.example.com:2181,zk3.example.com:2181/cluster-name
# ── Listeners ────────────────────────────────────────────────
listeners=PLAINTEXT://broker1.example.com:9092,EXTERNAL://0.0.0.0:29095,SASL_PLAINTEXT://broker1.example.com:9095
advertised.listeners=PLAINTEXT://broker1.example.com:9092,EXTERNAL://kafka.example.com:29095,SASL_PLAINTEXT://broker1.example.com:9095
# ── Security ─────────────────────────────────────────────────
security.inter.broker.protocol=SASL_PLAINTEXT
sasl.enabled.mechanisms=PLAIN
sasl.mechanism.inter.broker.protocol=PLAIN
# ── Storage ──────────────────────────────────────────────────
log.dirs=/opt/kafka/data
num.partitions=3
default.replication.factor=3
min.insync.replicas=2
auto.create.topics.enable=false
delete.topic.enable=true
log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=1

b) Restart the updated broker one at a time and Check that Kafka is running:

NOTE: After restarting all brokers with this config, 
Once the final ZK broker has been restarted with the necessary configuration,
the migration will automatically begin. When the migration is complete, an INFO level log can be observed on the active controller as below:

# check logs for this message:
# "Completed migration of metadata from ZooKeeper to KRaft"

NOTE - Once the KRaft controller completes the metadata migration, the brokers will still be running in ZooKeeper mode. While the KRaft controller is in migration mode, 
it will continue sending controller RPCs to the ZooKeeper mode brokers. This includes RPCs like UpdateMetadata and LeaderAndIsr.
